# Publica o back-end (worker/) no Cloudflare Workers a cada push na main.
# Secrets necessários em Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#   SERPER_API_KEY, GEMINI_API_KEY, TRELLO_API_KEY, TRELLO_TOKEN, TRELLO_LIST_ID, TRELLO_BOARD_ID
name: Deploy Worker (API)

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            SERPER_API_KEY
            GEMINI_API_KEY
            TRELLO_API_KEY
            TRELLO_TOKEN
            TRELLO_LIST_ID
            TRELLO_BOARD_ID
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_LIST_ID: ${{ secrets.TRELLO_LIST_ID }}
          TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
